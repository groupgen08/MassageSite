# .pages.yml
# Финальная конфигурация для Pages CMS

# 1. Секция MEDIA
# Определяет, где хранятся и куда загружаются изображения
media:
  - name: "images"
    label: "Изображения"
    input: "images"          # Папка в репозитории
    output: "/images"        # Путь, который будет вставляться в контент
    extensions: ["jpg", "png", "svg", "webp"] # Разрешенные типы

# 2. Секция CONTENT
# Определяет редактируемые файлы с данными
content:
  # --- ФАЙЛ 1: Главная (Видение лидера) ---
  - name: "index"
    label: "Главная (Видение лидера)"
    type: "file"
    path: "_data/index.json"
    format: "json"
    fields:
      - { name: "title", label: "Заголовок (SEO)", type: "string" }
      - name: "hero"
        label: "Главный блок (Hero)"
        type: "object"
        fields:
          - { name: "image", label: "Изображение (куб)", type: "image" }
          - { name: "alt", label: "Alt текст", type: "string" }
          - { name: "h1", label: "Заголовок H1", type: "string" }
          - { name: "lead", label: "Подзаголовок", type: "text" }

      # --- УНИВЕРСАЛЬНЫЙ КОНСТРУКТОР БЛОКОВ ---
      - name: "content_blocks"
        label: "Конструктор контента"
        type: "object"
        list: true
        fields:
          # 1. Тип блока. ВОЗВРАЩАЕМ СТРУКТУРУ options: values:
          - name: "type"
            label: "🟢 ТИП БЛОКА (Сначала выберите это)"
            type: "select"
            default: "paragraph"
            options:
              values:
                - { label: "Заголовок H2", value: "h2" }
                - { label: "Заголовок H3", value: "h3" }
                - { label: "Параграф (Текст)", value: "paragraph" }
                - { label: "Неупорядоченный список", value: "list" }
                - { label: "--- СЕКЦИЯ РЕГУЛЯЦИЯ (Заголовок)", value: "regulation_header" }
                - { label: "Карточка Регуляции (Блок)", value: "regulation_card" }

          # 2. Основной текст (Для заголовков и параграфов)
          - name: "text"
            label: "📝 Текст (для заголовков, абзацев и карточек)"
            type: "text" # Используем type: text для многострочного ввода
            
          # 3. Элементы списка (Для обычных списков и списков внутри карточек)
          - name: "items"
            label: "📋 Элементы списка (ТОЛЬКО для списков)"
            type: "string"
            list: true

      - name: "manifest_author"
        label: "Подпись автора"
        type: "string"

      - name: "regulation_intro"
        label: "Регуляция: Введение"
        type: "rich-text"
        description: "Текст перед блоками (начинается с Заголовка Регуляция)"

      - name: "regulation_blocks"
        label: "Регуляция: Блоки"
        type: "object"
        list: true # Это создает список, в который можно добавлять новые элементы
        fields:
          - { name: "title", label: "Заголовок блока", type: "string" }
          - { name: "content", label: "Содержимое списка", type: "rich-text" }

  # --- ФАЙЛ 2: Холистический подход ---
  - name: "holistic"
    label: "Холистический подход"
    type: "file"
    path: "_data/holistic.json"
    format: "json"
    fields:
      - { name: "title", label: "Заголовок (SEO)", type: "string" }
      
      - name: "hero_image"
        label: "Верхнее изображение"
        type: "object"
        fields:
          - { name: "src", label: "Изображение", type: "image" }
          - { name: "alt", label: "Alt текст", type: "string" }
          
      - name: "author"
        label: "Карточка автора"
        type: "object"
        fields:
          - { name: "name", label: "Имя автора", type: "string" }
          - { name: "role", label: "Должность/Роль", type: "string" }
          - { name: "photo_src", label: "Фото автора", type: "image" }
          - { name: "photo_alt", label: "Alt текст фото", type: "string" }
          
      - name: "intro"
        label: "Введение (правая колонка)"
        type: "object"
        fields:
          - { name: "h1", label: "Заголовок H1", type: "string" }
          - { name: "lead", label: "Подзаголовок", type: "text" }
          - { name: "h2", label: "Заголовок H2", type: "string" }
          - { name: "intro_text", label: "Текст введения", type: "text" }
      
      # --- КОНСТРУКТОР БЛОКОВ (Вместо content_body) ---
      - name: "page_blocks"
        label: "Основной контент (Конструктор)"
        type: "object"
        list: true
        fields:
          # 1. Тип блока (Используем рабочий синтаксис options: values:)
          - name: "type"
            label: "🟢 ТИП БЛОКА"
            type: "select"
            default: "paragraph"
            options:
              values:
                - { label: "Заголовок H2", value: "h2" }
                - { label: "Заголовок H3", value: "h3" }
                - { label: "Параграф (Текст)", value: "paragraph" }
                - { label: "Маркированный список", value: "list" }
          
          # 2. Текстовое поле
          - name: "text"
            label: "📝 Текст (для заголовков и параграфов)"
            type: "text" # Многострочное поле
            
          # 3. Элементы списка
          - name: "items"
            label: "📋 Элементы списка (ТОЛЬКО для списков)"
            type: "string"
            list: true

  # --- ФАЙЛ 3: Апитерапия ---
  - name: "apitherapy"
    label: "Апитерапия"
    type: "file"
    path: "_data/apitherapy.json"
    format: "json"
    fields:
      - { name: "title", label: "Заголовок (SEO)", type: "string" }
      
      - name: "hero"
        label: "Шапка страницы"
        type: "object"
        fields:
          - { name: "image", label: "Изображение (шапка)", type: "image" }
          - { name: "alt", label: "Alt текст", type: "string" }
          - { name: "h1", label: "Заголовок H1", type: "string" }
          - { name: "lead", label: "Подзаголовок", type: "text" }
          
      - name: "intro"
        label: "Вводный блок"
        type: "object"
        fields:
          - name: "photo"
            label: "Фото"
            type: "object"
            fields:
              - { name: "src", label: "Изображение", type: "image" }
              - { name: "alt", label: "Alt текст", type: "string" }
          - { name: "heading", label: "Заголовок введения", type: "string" }
          - { name: "text", label: "Текст введения", type: "text" }

      # --- КОНСТРУКТОР БЛОКОВ (Вместо старых полей body) ---
      - name: "page_blocks"
        label: "Секции страницы"
        type: "object"
        list: true
        fields:
          # 1. Тип секции
          - name: "type"
            label: "🟢 ТИП СЕКЦИИ"
            type: "select"
            default: "conditions_section"
            options:
              values:
                - { label: "Секция: Перечень сфер (Список)", value: "conditions_section" }
                - { label: "Секция: Как это работает (Текст)", value: "how_it_works_section" }
                - { label: "Секция: Галерея (Картинки)", value: "gallery_section" }
                - { label: "Секция: Важно/Заметки (Текст)", value: "notes_section" }

          # 2. Заголовок секции
          - name: "title"
            label: "🏷 Заголовок секции"
            type: "string"

          # 3. Текст секции (для How it Works и Notes)
          - name: "text"
            label: "📝 Текст (для текстовых секций)"
            type: "text"

          # 4. Список сфер (для Conditions)
          - name: "items"
            label: "📋 Список сфер (только для Conditions)"
            type: "string"
            list: true
            
          # 5. Галерея (для Gallery)
          - name: "gallery_items"
            label: "🖼 Элементы галереи (только для Gallery)"
            type: "object"
            list:
              summary: "Фото: {fields.caption}"
            fields:
              - { name: "image_src", label: "Изображение", type: "image" }
              - { name: "alt", label: "Alt текст", type: "string" }
              - { name: "caption", label: "Подпись", type: "string" }

  # --- ФАЙЛ 4: Фитотерапия ---
  - name: "phytotherapy"
    label: "Фитотерапия"
    type: "file"
    path: "_data/phytotherapy.json"
    format: "json"
    fields:
      - { name: "title", label: "Заголовок страницы (SEO)", type: "string" }
      
      - name: "hero"
        label: "Шапка страницы"
        type: "object"
        fields:
          - { name: "image", label: "Фон шапки", type: "image" }
          - { name: "alt", label: "Alt текст", type: "string" }
          - { name: "h1", label: "Заголовок H1", type: "string" }
          - { name: "lead", label: "Подзаголовок", type: "text" }
      
      - name: "doctor"
        label: "Данные врача"
        type: "object"
        fields:
          - { name: "photo", label: "Фото врача", type: "image" }
          - { name: "name", label: "Имя", type: "string" }
          - { name: "role", label: "Должность", type: "string" }
          
      - name: "intro_text"
        label: "Вводный текст (Манифест)"
        type: "object"
        fields:
          - { name: "heading", label: "Заголовок введения", type: "string" }
          - { name: "p1", label: "Абзац 1", type: "text" }
          - { name: "p2", label: "Абзац 2", type: "text" }
          - { name: "quote", label: "Цитата (выделенная)", type: "text" }

      # --- КОНСТРУКТОР БЛОКОВ ---
      - name: "page_blocks"
        label: "Контент страницы"
        type: "object"
        list: true
        fields:
          - name: "type"
            label: "🟢 ТИП БЛОКА"
            type: "select"
            default: "paragraph"
            options:
              values:
                - { label: "Заголовок H2", value: "h2" }
                - { label: "Абзац текста", value: "paragraph" }
                - { label: "СЕТКА ПРОГРАММЫ (Карточки)", value: "program_section" }
                - { label: "БЛОК КОНТАКТОВ (CTA)", value: "cta_block" }

          # Текст для простых блоков
          - name: "text"
            label: "📝 Текст (для H2 и Параграфов)"
            type: "text"
            
          # Данные для Сетки Программы
          - name: "items"
            label: "🌿 Шаги программы (Только для Сетки)"
            type: "object"
            list:
              summary: "Шаг {fields.step_num}: {fields.action}"
            fields:
              - { name: "step_num", label: "Номер шага", type: "string" }
              - { name: "action", label: "Действие (Заголовок)", type: "string" }
              - { name: "result", label: "Результат (Описание)", type: "text" }
              - { name: "plus_need", label: "+ Надо (Дополнительно)", type: "string" }

          # Данные для CTA
          - name: "title" 
            label: "Заголовок CTA" 
            type: "string"
          - name: "contact_label"
            label: "Текст кнопки"
            type: "string"
          - name: "contact_link"
            label: "Ссылка (https://wa.me/...)"
            type: "string"
          - name: "phone"
            label: "Телефон (текст)"
            type: "string"

  # --- ФАЙЛ 5: Как это работает (Метаболизм) ---
  - name: "how_it_works"
    label: "Как это работает"
    type: "file"
    path: "_data/how_it_works.json"
    format: "json"
    fields:
      - { name: "title", label: "Заголовок страницы (SEO)", type: "string" }
        
      - name: "hero"
        label: "Шапка страницы"
        type: "object"
        fields:
          - { name: "image", label: "Фон шапки", type: "image" }
          - { name: "alt", label: "Alt текст", type: "string" }
          - { name: "h1", label: "Заголовок H1", type: "string" }
          - { name: "lead", label: "Подзаголовок", type: "textarea" }

      # --- ДИНАМИЧЕСКИЙ КОНСТРУКТОР БЛОКОВ (ИЗМЕНЕНО) ---
      - name: "page_blocks"
        label: "Конструктор контента"
        type: "object"
        list: true
        # Убираем types и добавляем fields
        fields:
          # 0. Поле для выбора типа (Обязательное)
          - name: "type"
            label: "🟢 ТИП БЛОКА"
            type: "select"
            default: "paragraph"
            options:
              values:
                - { label: "1. Заголовок H2", value: "h2" }
                - { label: "2. Абзац текста", value: "paragraph" }
                - { label: "3. Маркированный список", value: "list" }
                - { label: "4. Диаграмма энергозатрат", value: "energy_breakdown" }
                - { label: "5. Фигура (Картинка с подписью)", value: "figure" }
                - { label: "6. Блок ATP", value: "atp_block" }
                - { label: "7. Сравнение Гликоген/Жир", value: "compare_glycogen_fat" }
                - { label: "8. Поток энергии", value: "energy_flow" }
                - { label: "9. Ссылка на источник", value: "source_credit" }
                - { label: "10. Манифест", value: "manifesto_block" }

          # --- ОБЩИЕ ПОЛЯ (для H2, Paragraph) ---
          - { name: "text", label: "📝 Текст/Заголовок H2/Манифест", type: "text", widget: "markdown" }
          
          # --- ПОЛЯ ДЛЯ 3. list ---
          - name: "data" 
            label: "3. Данные Маркированного списка (Только для 'list')"
            type: "object"
            fields:
              - { name: "items", label: "Пункты", type: "string", list: true } 

          # --- ПОЛЯ ДЛЯ 4. energy_breakdown ---
          - { name: "title", label: "4/6/7/8. Заголовок блока", type: "string" }
          - { name: "description", label: "4. Описание диаграммы", type: "textarea" }
          - name: "items" 
            label: "4. Данные органов (Только для 'energy_breakdown')"
            type: "object"
            list:
              summary: "{organ}: {percent}%"
            fields:
              - { name: "organ", label: "Орган", type: "string" }
              - { name: "percent", label: "Процент", type: "string" }

          # --- ПОЛЯ ДЛЯ 5. figure ---
          - { name: "image", label: "5/6. Изображение", type: "image" }
          - { name: "alt", label: "5/6. Alt текст", type: "string" }
          - { name: "caption", label: "5. Подпись к картинке", type: "string" }
          
          # --- ПОЛЯ ДЛЯ 6. atp_block ---
          - name: "key_points_data" 
            label: "6. Ключевые пункты ATP (Только для 'atp_block')"
            type: "object"
            fields:
              - { name: "points", label: "Пункты", type: "string", list: true } 
          - { name: "image_alt", label: "6. Alt схемы", type: "string" }
          - { name: "image_note", label: "6. Примечание к схеме", type: "string" }

          # --- ПОЛЯ ДЛЯ 7. compare_glycogen_fat ---
          - name: "left"
            label: "7. Левая колонка (Гликоген)"
            type: "object"
            fields:
              - { name: "title", label: "Заголовок колонки", type: "string" }
              - { name: "items", label: "Пункты", type: "string", list: true } 
          - name: "right"
            label: "7. Правая колонка (Жир)"
            type: "object"
            fields:
              - { name: "title", label: "Заголовок колонки", type: "string" }
              - { name: "items", label: "Пункты", type: "string", list: true } 
          - { name: "note", label: "7. Вывод/Заметка", type: "string" }

          # --- ПОЛЯ ДЛЯ 8. energy_flow ---
          - name: "steps" 
            label: "8. Шаги процесса (Только для 'energy_flow')"
            type: "object"
            list: true
            fields:
              - { name: "title", label: "Название шага", type: "string" }
              - { name: "text", label: "Описание", type: "textarea" }

          # --- ПОЛЯ ДЛЯ 9. source_credit ---
          - { name: "intro", label: "9. Вводный текст", type: "textarea" }
          - { name: "link_label", label: "9. Текст ссылки", type: "string" }
          - { name: "link_url", label: "9. URL", type: "string" }